Add your games to RomM
Copy ROMs into <code>DATA_ROMS/library/roms/&lt;platform&gt;/</code> (e.g. <code>snes</code>, <code>gba</code>, <code>ps</code>; BIOS files into <code>library/bios/&lt;platform&gt;/</code>), then in <a href="http://HOST:8090">RomM</a> run <b>Scan</b>. For cover art from IGDB/ScreenScraper add their API keys as described in the RomM docs.
